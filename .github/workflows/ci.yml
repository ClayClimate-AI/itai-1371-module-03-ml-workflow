name: CI — Zero-Defect Gates (L5)

# Layer 5: Objective Proof of Reproducibility.
# A clean Ubuntu runner clones ONLY committed code, installs ONLY declared dependencies,
# and re-runs the guardrail gates. "A local pass is subjective; a repository pass is objective."

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  zero-defect-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed code
        uses: actions/checkout@v4

      - name: Set up Python (pinned for reproducibility)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "::warning::requirements.txt not present yet — dependency install skipped (pre-C0)."
          fi

      - name: L1 — Setup Gate (dependency + environment integrity)
        run: |
          if [ -f scripts/setup_gate.py ]; then
            python scripts/setup_gate.py
          else
            echo "::warning::scripts/setup_gate.py not present yet — L1 gate skipped (pre-C0)."
          fi

      - name: L3 — Contract tests (TDD)
        run: |
          if [ -d tests ] && ls tests/*.py >/dev/null 2>&1; then
            pip install pytest
            pytest -q tests
          else
            echo "::warning::No tests present yet — L3 gate skipped (pre-C0)."
          fi

      - name: L5 — Notebook execution (headless reproducibility proof)
        run: |
          if [ -f Module_03_Lab_Exercise.ipynb ]; then
            pip install jupyter nbconvert
            jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=600 \
              Module_03_Lab_Exercise.ipynb
          else
            echo "::warning::Notebook not found — execution step skipped."
          fi
